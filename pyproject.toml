[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "book-reading-assistant"
version = "0.1.0"
description = "CLI tool that reviews book reading notes against fichamento techniques using Claude AI"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0",
    "typer[all]>=0.15.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.7.0",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
]

[project.scripts]
notes = "book_reading_assistant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/book_reading_assistant"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
